<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artwork Details - ArtVault</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="details.css" />
    <script src="index.js?v=7" defer></script>
  </head>

  <body class="details-page">
    <header class="site-header">
      <nav class="top-nav" aria-label="Main navigation">
        <a class="brand" href="index.html">ArtVault</a>

        <div class="nav-actions">
            <div class="primary-links">
                <a href="index_search.html">Browse art</a>
                <a href="mybids.html">My bids</a>
            </div>

            <form class="search-form" action="index_search.html" method="get">
              <label class="visually-hidden" for="search-input">
                  Search ArtVault
              </label>

              <input
                  id="search-input"
                  type="search"
                  name="q"
                  placeholder="Hinted search text"
              >

              <button class="search-button" type="submit" aria-label="Search">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                      <circle cx="11" cy="11" r="7"></circle>
                      <path d="m16.5 16.5 4 4"></path>
                  </svg>
              </button>
            </form>

            <a class="profile-button" href="profile.html" aria-label="Profile">
              <span id="homepage-username"></span>
              <img
                  id="homepage-profile"
                  src="profile.png"
                  alt="Profile"
              >
            </a>
        </div>
      </nav>
    </header>

    <main class="details-main">
      <section class="details-shell">
        <div class="details-image-panel">
          <img
            id="selected-artwork-image"
            src="medium-photography.jpg"
            alt="Spring Canopy"
          />
        </div>
        <div class="details-content">
          <h1 id="selected-artwork-title">Spring Canopy</h1>
          <p id="selected-artwork-description">
            Red Rock Landscape Photograph
          </p>
          <p class="details-price">from $100</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div>
          <h3>About</h3>
          <p>
            ArtVault connects collectors with original works from artists and
            trusted sellers around the world.
          </p>
        </div>
        <div>
          <h3>Quick Links</h3>
          <a href="index_search.html">Browse</a>
          <a href="mybids.html">My Bids</a>
          <a href="profile.html">Profile</a>
        </div>
        <div>
          <h3>Contact</h3>
          <p>hello@artvault.com</p>
          <div class="social-icons" aria-label="Social links">
            <a class="instagram-link" href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a class="social-icon-link" href="#" aria-label="X"><i class="fa-brands fa-x-twitter"></i></a>
            <a class="social-icon-link" href="#" aria-label="Facebook"><i class="fa-brands fa-facebook"></i></a>
          </div>
        </div>
      </div>
      <p class="copyright">&copy; 2026 ArtVault. All rights reserved.</p>
    </footer>

    <script>
      const detailsParams = new URLSearchParams(window.location.search);
      const selectedImage = detailsParams.get("img");
      const selectedTitle = detailsParams.get("title");
      const detailsImage = document.getElementById("selected-artwork-image");
      const detailsTitle = document.getElementById("selected-artwork-title");
      const detailsDescription = document.getElementById(
        "selected-artwork-description"
      );
      const artworkDetails = [
        {
          image: "medium-oil.jpg",
          title: "Abstract Oil Painting",
          name: "Bloom Study",
        },
        {
          image: "medium-watercolor.jpg",
          title: "Blue Watercolor Painting",
          name: "Quiet Interior",
        },
        {
          image: "medium-sculpture.jpg",
          title: "Sculpture Artwork",
          name: "Sculpture Artwork",
        },
        {
          image: "medium-photography.jpg",
          title: "Red Rock Landscape Photograph",
          name: "Spring Canopy",
        },
        {
          image: "medium-digital.jpg",
          title: "Colorful Digital Geometric Artwork",
          name: "Prism Field",
        },
      ];
      const selectedArtwork = artworkDetails.find((artwork) => {
        return artwork.image === selectedImage || artwork.title === selectedTitle;
      });
      const artworkName = selectedArtwork?.name || selectedTitle || "Spring Canopy";
      const artworkDescription =
        selectedArtwork?.title ||
        selectedTitle ||
        "Red Rock Landscape Photograph";

      if (selectedImage) {
        detailsImage.src = selectedImage;
      }

      detailsImage.alt = artworkDescription;
      detailsTitle.textContent = artworkName;
      detailsDescription.textContent = artworkDescription;
    </script>
  </body>
</html>
