{% extends 'marketplace/base.html' %}

{% block title %}Register | ArtVault{% endblock %}

{% block content %}
  <h1 class="page-title">Create Account</h1>
  <form class="form-panel" method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <p>
        {{ field.label_tag }}
        {{ field }}
        {{ field.errors }}
      </p>
    {% endfor %}
    <button type="submit">Register</button>
  </form>
{% endblock %}
