<nav class="step-nav" aria-label="Bid finalization steps">
  <a class="step-link {% if current_step == 'contact' %}is-current{% endif %}" href="{% url 'marketplace:finalize_bid_step' bid.pk 'contact' %}">Contact</a>
  {% if has_contact %}
    <a class="step-link {% if current_step == 'payment' %}is-current{% endif %}" href="{% url 'marketplace:finalize_bid_step' bid.pk 'payment' %}">Payment</a>
  {% else %}
    <span class="step-link disabled">Payment</span>
  {% endif %}
  {% if has_payment %}
    <a class="step-link {% if current_step == 'review' %}is-current{% endif %}" href="{% url 'marketplace:finalize_bid_step' bid.pk 'review' %}">Review</a>
  {% else %}
    <span class="step-link disabled">Review</span>
  {% endif %}
  <span class="step-link {% if current_step == 'confirmation' %}is-current{% else %}disabled{% endif %}">Confirmation</span>
</nav>
