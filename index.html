<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtVault</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- Header -->
    <header class="header">

        <!-- Top bar -->
        <div class="topbar container">

            <div class="logo">
                <a href="/">Art<span>Vault</span></a>
            </div>

            <div class="search">
                <form action="/search" method="get">
                    <label for="search-input" class="visually-hidden">Leita</label>
                    <input id="search-input" type="text" name="q" placeholder="Leitaðu á vefnum">
                </form>
            </div>

            <nav class="actions" aria-label="User actions">
                <ul>
                    <!--we will need to update sign in and liked-->
                    <li><a href="#">Sign in</a></li>
                    <li><a href="#">Liked</a></li>
                </ul>
            </nav>

        </div>

        <!-- Main nav -->
        <nav class="navbar" aria-label="Main navigation">
            <div class="container">

                <ul class="nav-links">
                    <li><a href="#">Art works</a></li>
                    <li><a href="#">Filter</a></li>
                </ul>

                <div class="nav-right">
                    <a href="#">contact</a>
                </div>

            </div>
        </nav>

    </header>

    <!-- Main -->
    <main>

        <section class="hero">

            <div class="hero-container container">

                <!-- Left -->
                <div class="hero-left">
                    <div class="art-grid">
                        <img src="img1.jpg" alt="Artwork example">
                        <img src="img2.jpg" alt="Artwork example">
                        <img src="img3.jpg" alt="Artwork example">
                    </div>
                </div>

                <!-- Center -->
                <div class="hero-content">
                    <h1>Íslensk myndlist í fararbroddi</h1>
                    <p>
                        Vertu heima og fjárfestu í íslenskri myndlist.
                        Beint frá vinnustofum listamanna, heim til þín.
                    </p>
                    <a href="#" class="cta-button">Skoða öll verk</a>
                </div>

                <!-- Right -->
                <div class="hero-right">
                    <div class="art-grid">
                        <!--remember to chnge image name when art implemented-->
                        <img src="img4.jpg" alt="Artwork example">
                        <img src="img5.jpg" alt="Artwork example">
                        <img src="img6.jpg" alt="Artwork example">
                    </div>
                </div>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; ArtVault</p>
        </div>
    </footer>

</body>
</html>
