<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ArtVault</title>
    <link rel="stylesheet" href="index.css">

    <style>
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin-bottom: 10px;
            border: 2px solid #ccc;
        }
    </style>
</head>

<body>

    <header class="top-bar">
        <a href="index.html" class="logo">ArtVault</a>
    </header>

    <main class="auth">
        <div class="auth-container">
            <h1>Profile</h1>

            <form id="profile-form" action="#" method="post" enctype="multipart/form-data">
                
                <div class="form-group">
                    <label for="name">Name</label>
                    <input id="name" type="text" name="name" value="Current User Name" required>
                </div>

                <div class="form-group">
                    <label for="profile-image">Profile Image</label>

                    <img 
                        id="profile-preview"
                        src="placeholder-avatar.jpg"
                        alt="Current Profile"
                        class="profile-avatar"
                    >

                    <input 
                        id="profile-image"
                        type="file"
                        name="profile-image"
                        accept="image/*"
                    >
                </div>

                <button type="submit">Update Profile</button>
            </form>

            <div id="status-message" style="margin-top: 15px; display: none;"></div>
        </div>
    </main>

    <script>
        const form = document.getElementById('profile-form');
        const imageInput = document.getElementById('profile-image');
        const previewImage = document.getElementById('profile-preview');
        const statusDiv = document.getElementById('status-message');

        // Default profile image
        const defaultImage = "avatar-placeholder.jpg";

        // Load saved image or use default
        const savedImage = localStorage.getItem('profileImage');

        if (savedImage) {
            previewImage.src = savedImage;
        } else {
            previewImage.src = defaultImage;
        }

        // Preview and save uploaded image
        imageInput.addEventListener('change', function() {
            const file = this.files[0];

            if (file) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    previewImage.src = e.target.result;

                    // Save image
                    localStorage.setItem('profileImage', e.target.result);
                };

                reader.readAsDataURL(file);
            }
        });

        // Form submit
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            statusDiv.textContent = "Profile updated successfully!";
            statusDiv.style.color = "green";
            statusDiv.style.display = "block";
        });
    </script>

</body>
</html>
