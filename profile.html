<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ArtVault</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <main class="auth">
        <div class="auth-container">
            <h1>Profile</h1>

            <form id="profile-form" action="#" method="post" enctype="multipart/form-data">
                
                <div class="form-group">
                    <label for="name">Name</label>
                    <input id="name" type="text" name="name" value="Current User Name" required>
                </div>

                <div class="form-group">
                    <label for="profile-image">Profile Image</label>
                    <img src="placeholder-avatar.jpg" alt="Current Profile" style="width: 100px; height: 100px; border-radius: 50%; display: block; margin-bottom: 10px;">
                    <input id="profile-image" type="file" name="profile-image" accept="image/*">
                </div>

                <button type="submit">Update Profile</button>
            </form>

            <div id="status-message" style="margin-top: 15px; display: none;"></div>
        </div>
    </main>

    <script>
        // Placeholder logic for handling the form submission and feedback
        document.getElementById('profile-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const statusDiv = document.getElementById('status-message');
            
            // Logic to simulate API call would go here
            const success = true; // Change this to test error state

            if (success) {
                statusDiv.textContent = "Profile updated successfully!";
                statusDiv.style.color = "green";
            } else {
                statusDiv.textContent = "Failed to update profile. Please try again.";
                statusDiv.style.color = "red";
            }
            statusDiv.style.display = "block";
        });
    </script>

</body>
</html>
