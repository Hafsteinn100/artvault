<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ArtVault</title>
    <link rel="stylesheet" href="profile.css">

    <style>
        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin-bottom: 10px;
            border: 2px solid #ccc;
        }
    </style>
</head>

<body>

    <header class="site-header">
  <nav class="top-nav" aria-label="Main navigation">
    <a class="brand" href="/">ArtVault</a>

    <div class="nav-actions">
        <div class="primary-links">
            <a href="#">Browse art</a>
            <a href="#">My bids</a>
        </div>

        <a class="profile-button" href="profile.html" aria-label="Profile">
          <span id="homepage-username"></span>
          <img
              id="homepage-profile"
              src="profile.png"
              alt="Profile"
          >
        </a>
    </div>
  </nav>
</header>

    <main class="auth">
        <div class="auth-container">
            <h1>Profile</h1>

            <form id="profile-form" action="#" method="post" enctype="multipart/form-data">
                
                <div class="form-group">
                    <label for="name">Name</label>
                    <input id="name" type="text" name="Name" value="Lisa" required>
                </div>

                <div class="form-group">
                    <label for="profile-image">Profile Image</label>

                    <img
                        id="profile-preview"
                        src="profile.png"
                        alt="Profile"
                        class="profile-avatar"
                    >

                    <input
                        id="profile-image"
                        type="file"
                        accept="image/*"
                    >
                </div>

                <button type="submit">Update Profile</button>
                <button type="button" id="reset-profile">Reset Profile</button>
            </form>

            <div id="status-message" style="margin-top: 15px; display: none;"></div>
        </div>
    </main>

    <script src="profile.js"></script>

</body>
</html>
